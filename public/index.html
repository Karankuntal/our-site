<body>

<script>
const password = "Ashikaran831";

function askPassword() {
    let userInput = prompt("Enter password to access the site");

    if (userInput === password) {
        // correct → allow access
        return;
    } else if (userInput === null) {
        // user pressed cancel
        document.body.innerHTML = "<h1>Access Cancelled</h1>";
    } else {
        alert("Wrong password, try again!");
        askPassword(); // retry
    }
}

askPassword();
</script>

<h1>Our Beautiful Memories ❤️</h1>
