<!DOCTYPE html>
<html>

<head>
<title>Our Beautiful Memories ❤️</title>

<link rel="stylesheet" href="./style.css">

</head>

<body>

<!-- PASSWORD SCREEN -->
<div id="loginScreen" style="text-align:center; margin-top:100px;">
<h2>Enter password to access the site</h2>

<input 
type="password"
id="passwordInput"
placeholder="Enter password"
style="padding:10px; font-size:16px;"
>

<button onclick="checkPassword()" style="padding:10px 20px; font-size:16px;">
Enter
</button>

</div>

<!-- MAIN WEBSITE -->
<div id="mainSite" style="display:none;">

<h1>Our Beautiful Memories ❤️</h1>

<p>Upload your photos and videos</p>

<div class="uploadBox" onclick="openUpload()">
+
</div>

<input 
type="file"
id="fileInput"
multiple
hidden
accept="image/*,video/*"
>

<!-- ORBIT SYSTEM -->
<div id="orbitSystem" class="orbitSystem"></div>

<!-- FULLSCREEN VIEWER -->
<div id="fullscreenViewer" class="viewer" onclick="closeViewer()">

<button id="deleteMediaBtn">Delete</button>

<img id="viewerImage">

<video id="viewerVideo" controls></video>

</div>

</div>

<script>
const password = "Ashikaran831";

function checkPassword(){

    const userInput = document.getElementById("passwordInput").value;

    if(userInput === password){
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("mainSite").style.display = "block";
    }else{
        alert("Access Denied");
    }

}
</script>

<script src="./script.js"></script>

</body>

</html>
